      function formatPrice(amount, currency) {
        const locale = currency === "CNY" ? "zh-CN" : "en-GB";
        return new Intl.NumberFormat(locale, {
          style: "currency",
          currency,
          maximumFractionDigits: currency === "CNY" ? 0 : 2
        }).format(amount);
      }

      function getPriceRangeCny(item) {
        const prices = item.colorOptions.map((option) => option.basePriceCny);
        return { min: Math.min(...prices), max: Math.max(...prices) };
      }

      function formatItemPrice(item) {
        const range = getPriceRangeCny(item);
        const minPrice = formatPrice(range.min * rateState.rate, rateState.currency);
        const maxPrice = formatPrice(range.max * rateState.rate, rateState.currency);
        return range.min === range.max ? minPrice : `${minPrice}–${maxPrice}`;
      }

      function getColorTone(color) {
        const normalized = color.toLowerCase();
        if (normalized.includes("yellow") || normalized.includes("gold")) return "yellow";
        if (normalized.includes("blue") || normalized.includes("turquoise") || normalized.includes("aqua")) return "blue";
        if (normalized.includes("pink")) return "pink";
        if (normalized.includes("red")) return "red";
        if (normalized.includes("green")) return "green";
        if (normalized.includes("purple") || normalized.includes("lavender")) return "purple";
        if (normalized.includes("orange")) return "orange";
        if (normalized.includes("black")) return "black";
        return "white";
      }

            closeSound.volume = 0.8;

          closeSound.currentTime = 0;

        } catch {
        }
      }

      async function playProfileTapSoundTriple() {
        const token = ++profileTapPlayToken;

        try {
          if (!profileTapSound) {
            profileTapSound = new Audio(shopConfig.profileTapSoundSrc);
            profileTapSound.preload = "auto";
            profileTapSound.volume = 0.92;
          }

          for (let index = 0; index < 1; index += 1) {
            if (token !== profileTapPlayToken) return;

            await new Promise((resolve, reject) => {
              const sound = profileTapSound;
              if (!sound) {
                resolve();
                return;
              }

              const finish = () => {
                cleanup();
                resolve();
              };
              const fail = () => {
                cleanup();
                reject();
              };
              const cleanup = () => {
                sound.removeEventListener("ended", finish);
                sound.removeEventListener("error", fail);
              };

              sound.currentTime = 0;
              sound.addEventListener("ended", finish, { once: true });
              sound.addEventListener("error", fail, { once: true });
              sound.play().catch(fail);
            });
          }
        } catch {
        }
      }

        return rateState.updatedAt ? `${t.rateUpdated} ${rateState.updatedAt}` : t.rateReady;

      async function loadRate() {
        const currency = currencyForLanguage(language);

        if (currency === "CNY") {
          rateState = {
            currency: "CNY",
            rate: 1,
            status: "live",
            updatedAt: new Date().toISOString().slice(0, 10)
          };
          renderApp();
          return;
        }

        rateState = { currency: "GBP", rate: 0.11, status: "loading", updatedAt: "" };
        renderApp();

        try {
          const response = await fetch("https://open.er-api.com/v6/latest/CNY");
          if (!response.ok) throw new Error("Rate request failed");
          const data = await response.json();
          const nextRate = data.rates?.GBP;
          if (!nextRate) throw new Error("Missing rate");
          rateState = {
            currency: "GBP",
            rate: nextRate,
            status: "live",
            updatedAt: data.time_last_update_utc
              ? new Date(data.time_last_update_utc).toISOString().slice(0, 10)
              : ""
          };
        } catch {
          rateState = { currency: "GBP", rate: 0.11, status: "fallback", updatedAt: "" };
        }

        renderApp();
      }

                  <button class="${currentPage === "sponsor" ? "active" : ""}" type="button" data-page="sponsor">${t.navSponsor}</button>
                </nav>
              </div>
            </div>
          </header>
        `;
      }

      function renderPrices() {
        const t = copy[language];
        return `
          <section class="price-page" aria-label="String price list">
            <div class="hero-panel compact-standards">
              <p class="eyebrow">${t.heroEyebrow}</p>
              <div class="standard-grid">
                ${t.heroPoints.map((point) => `<span>${point}</span>`).join("")}
              </div>
            </div>
            <div class="string-list">
              ${orderedStringCatalog
                .map(
                  (item) => `
                    <button class="string-row ${item.serviceOnly ? "service-only" : ""}" type="button" data-string-id="${item.id}">
                      <span class="row-topline">
                        <span class="string-name">${renderStringIdentity(item)}${item.hot ? '<span class="hot-flame" aria-label="Popular">🔥</span>' : ""}</span>
                        ${item.badge ? `<span class="badge">${labelForBadge(item.badge)}</span>` : ""}
                      </span>
                      ${
                        item.serviceOnly
                          ? ""
                          : `<span class="string-detail">
                              <span>${item.gauge}</span>
                              <span>${featureCopy[item.id]?.[language] || item.features}</span>
                            </span>`
                      }
                      <span class="row-price">${formatItemPrice(item)}</span>
                    </button>`
                )
                .join("")}
            </div>
          </section>
        `;
      }

      function renderProfile() {
        const t = copy[language];
        return `
          <section class="profile-page" aria-label="Stringer profile">
            <div class="profile-stage">
              <div class="profile-photo-stage">
                <img class="profile-hero-bg" src="${shopConfig.profileImages.heroBackgroundSrc}" alt="" aria-hidden="true" />
                <div class="profile-atmosphere" aria-hidden="true"></div>
                <img class="profile-hero-person" src="${shopConfig.profileImages.heroPersonSrc}" alt="Jimmy Xie" />
                <button class="profile-sound-hotspot" type="button" data-profile-sound aria-label="Play Jimmy audio"></button>
              </div>
              <div class="profile-copy">
                <h2>${shopConfig.stringerName}</h2>
                <p>${renderProfileBody()}</p>
              </div>
            </div>
            ${
              shopConfig.profileImages.galleryImages.length
                ? `<section class="profile-gallery" aria-label="${t.galleryEyebrow}">
                    <p class="eyebrow">${t.galleryEyebrow}</p>
                    <div class="gallery-rail">
                      <div class="gallery-track">
                        ${[0, 1]
                          .map(
                            (setIndex) => `<div class="gallery-set">
                              ${shopConfig.profileImages.galleryImages
                                .map((image, index) => {
                                  const cleanSrc = image.src.split('?')[0];
                                  const filename = cleanSrc.split('/').pop();
                                  return `<div class="gallery-img-wrap" data-gallery-index="${index}">
                                    <img src="${image.src}" alt="${image.alt}" />
                                    <button class="download-btn" type="button" aria-label="Download image" data-download-src="${cleanSrc}" data-download-filename="${filename}">
                                      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                                        <path d="M12 2v14m0 0l-5-5m5 5l5-5M4 22h16"/>
                                      </svg>
                                    </button>
                                  </div>`;
                                })
                                .join("")}
                            </div>`
                          )
                          .join("")}
                      </div>
                    </div>
                  </section>`
                : ""
            }
          </section>
        `;
      }

      function renderSponsor() {
        const t = copy[language];
        const teamImages = shopConfig.teamImages;
        return `
          <section class="sponsor-page" aria-label="Team page">
            <div class="sponsor-panel">
              <p class="eyebrow">${t.sponsorEyebrow}</p>
              <div class="team-grid">
                ${t.teamMembers
                  .map(
                    (member, index) => `
                      <article class="team-card">
                        <img src="${teamImages[index]}" alt="${member.name}" />
                        <div class="team-copy">
                          <h3>${member.name}</h3>
                          <p>${member.role}</p>
                        </div>
                      </article>`
                  )
                  .join("")}
              </div>
            </div>
          </section>
        `;
      }

      function renderFooter() {
        const t = copy[language];
        return `
          <footer class="site-footer">
            <div>
              <span class="contact-pill">
                <span class="wechat-icon" aria-hidden="true">
                  <svg viewBox="0 0 32 28" focusable="false">
                    <path class="wechat-main" d="M13.4 3.4C7 3.4 1.8 7.5 1.8 12.5c0 2.8 1.7 5.3 4.3 7l-.8 3.1 3.7-1.7c1.4.5 2.9.7 4.4.7 6.4 0 11.6-4.1 11.6-9.1s-5.2-9.1-11.6-9.1Z"></path>
                    <path class="wechat-front" d="M20.8 10.4c5.2 0 9.4 3.3 9.4 7.4 0 2.2-1.2 4.2-3.2 5.5l.6 2.5-3-1.4c-1.1.4-2.4.7-3.8.7-5.2 0-9.4-3.3-9.4-7.3 0-4.1 4.2-7.4 9.4-7.4Z"></path>
                    <circle cx="9.6" cy="10.7" r="1.2"></circle>
                    <circle cx="16.2" cy="10.7" r="1.2"></circle>
                    <circle cx="17.8" cy="16.6" r="1"></circle>
                    <circle cx="23.2" cy="16.6" r="1"></circle>
                  </svg>
                </span>
                ${shopConfig.wechatId}
              </span>
              <span class="contact-pill">
                <span class="x-icon" aria-hidden="true">𝕏</span>
                @${shopConfig.xHandle}
              </span>
            </div>
          </footer>
        `;
      }

      function renderCurrentPage() {
        if (currentPage === "profile") return renderProfile();
        if (currentPage === "sponsor") return renderSponsor();
        return renderPrices();
      }

      function renderApp() {
        appShell.lang = language === "zh" ? "zh-CN" : "en";
        appShell.innerHTML = `${renderHeader()}<div class="page-transition ${pageDirection}">${renderCurrentPage()}</div>${renderFooter()}`;
        bindAppEvents();
        updateProfileProgress();
      }

      function bindAppEvents() {
        appShell.querySelector("[data-language-toggle]")?.addEventListener("click", () => {
          appShell.classList.add("language-transition");
          language = language === "en" ? "zh" : "en";
          loadRate();
          window.setTimeout(() => appShell.classList.remove("language-transition"), 590);
        });

        appShell.querySelectorAll("[data-page]").forEach((button) => {
          button.addEventListener("click", () => {
            const nextPage = button.dataset.page;
            if (nextPage === currentPage) return;
            pageDirection =
              pageOrder.indexOf(nextPage) > pageOrder.indexOf(currentPage)
                ? "from-right"
                : "from-left";
            currentPage = nextPage;
            window.scrollTo({ top: 0, behavior: "smooth" });
            renderApp();
          });
        });

        appShell.querySelectorAll("[data-string-id]").forEach((button) => {
          button.addEventListener("click", () => {
            const item = orderedStringCatalog.find((entry) => entry.id === button.dataset.stringId);
            if (item) openOrderSheet(item);
          });
        });

        appShell.querySelector("[data-profile-sound]")?.addEventListener("click", playProfileTapSoundTriple);

        bindGalleryTouch();
      }

      function bindGalleryTouch() {
        const track = appShell.querySelector(".gallery-track");
        if (!track) return;

        const wraps = appShell.querySelectorAll(".gallery-img-wrap");
        let longPressTimer = null;
        let touchStartTarget = null;
        let touchMoved = false;
        let longPressTriggered = false;
        let lastTouchTime = 0;

        function toggleGallery() {
          track.classList.toggle("paused");
        }

        function updateGalleryDistance() {
          const firstSet = track.querySelector(".gallery-set");
          if (!firstSet) return;
          const gap = Number.parseFloat(window.getComputedStyle(track).columnGap || "0") || 0;
          track.style.setProperty("--gallery-distance", `${firstSet.getBoundingClientRect().width + gap}px`);
        }

        updateGalleryDistance();
        window.requestAnimationFrame(updateGalleryDistance);
        track.querySelectorAll("img").forEach((image) => {
          if (image.complete) return;
          image.addEventListener("load", updateGalleryDistance, { once: true });
        });
        if (window.galleryDistanceResizeHandler) {
          window.removeEventListener("resize", window.galleryDistanceResizeHandler);
        }
        window.galleryDistanceResizeHandler = updateGalleryDistance;
        window.addEventListener("resize", window.galleryDistanceResizeHandler);

        // 触摸开始：准备识别轻触/长按
        function handleTouchStart(event) {
          touchStartTarget = event.target.closest(".gallery-img-wrap");
          touchMoved = false;
          longPressTriggered = false;

          // 长按检测：600ms 后显示下载按钮
          longPressTimer = window.setTimeout(() => {
            longPressTimer = null;
            longPressTriggered = true;
            // 隐藏所有其他下载按钮
            wraps.forEach((wrap) => wrap.classList.remove("show-download"));
            if (touchStartTarget) {
              touchStartTarget.classList.add("show-download");
            }
          }, 600);
        }

        // 触摸结束：轻触切换暂停/播放，清除长按计时器
        function handleTouchEnd() {
          if (longPressTimer !== null) {
            window.clearTimeout(longPressTimer);
            longPressTimer = null;
          }
          if (!touchMoved && !longPressTriggered) {
            toggleGallery();
            lastTouchTime = Date.now();
          }
          touchStartTarget = null;
        }

        // 移动到其他元素时取消长按
        function handleTouchMove() {
          touchMoved = true;
          if (longPressTimer !== null) {
            window.clearTimeout(longPressTimer);
            longPressTimer = null;
          }
        }

        function handleTouchCancel() {
          if (longPressTimer !== null) {
            window.clearTimeout(longPressTimer);
            longPressTimer = null;
          }
          touchStartTarget = null;
        }

        wraps.forEach((wrap) => {
          wrap.addEventListener("touchstart", handleTouchStart, { passive: true });
          wrap.addEventListener("touchend", handleTouchEnd, { passive: true });
          wrap.addEventListener("touchmove", handleTouchMove, { passive: true });
          wrap.addEventListener("touchcancel", handleTouchCancel, { passive: true });
          wrap.addEventListener("click", (event) => {
            if (Date.now() - lastTouchTime < 450 || event.target.closest(".download-btn")) return;
            toggleGallery();
          });

          // 下载按钮点击事件
          const btn = wrap.querySelector(".download-btn");
          if (btn) {
            btn.addEventListener("click", (event) => {
              event.stopPropagation();
              const src = btn.dataset.downloadSrc;
              const filename = btn.dataset.downloadFilename;
              if (!src) return;

              const link = document.createElement("a");
              link.href = src;
              link.download = filename || "gallery-image";
              document.body.appendChild(link);
              link.click();
              document.body.removeChild(link);

              // 下载后隐藏按钮
              window.setTimeout(() => {
                wrap.classList.remove("show-download");
              }, 1200);
            });
          }
        });

        // 点击页面其他区域隐藏所有下载按钮
        document.addEventListener("click", (event) => {
          if (!event.target.closest(".gallery-img-wrap")) {
            wraps.forEach((wrap) => wrap.classList.remove("show-download"));
          }
        }, { passive: true });
      }

      function showQrModal() {
        const qrLayer = document.createElement("div");
        qrLayer.className = "qr-layer";
        qrLayer.setAttribute("role", "dialog");
        qrLayer.setAttribute("aria-modal", "true");
        qrLayer.innerHTML = `
          <button class="qr-backdrop" type="button" aria-label="Close QR"></button>
          <div class="qr-sheet">
            <div class="qr-wrap" data-qr-wrap>
              <img src="./assets/payment-qr.jpg?v=20260529o" alt="Payment QR code" />
              <button class="qr-download-btn" type="button" aria-label="Download QR code">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                  <polyline points="7 10 12 15 17 10"/>
                  <line x1="12" y1="15" x2="12" y2="3"/>
                </svg>
              </button>
            </div>
            <p class="qr-hint">${language === "zh" ? "长按保存二维码" : "Long press to save QR code"}</p>
          </div>
        `;

        const closeQr = () => {
          qrLayer.classList.add("closing");
          setTimeout(() => qrLayer.remove(), 280);
        };

        qrLayer.querySelector(".qr-backdrop").addEventListener("click", closeQr);

        const qrWrap = qrLayer.querySelector("[data-qr-wrap]");
        let qrTimer = null;

        qrWrap.addEventListener("touchstart", (e) => {
          qrTimer = setTimeout(() => {
            qrWrap.classList.add("show-download");
          }, 600);
        }, { passive: true });

        qrWrap.addEventListener("touchmove", () => {
          clearTimeout(qrTimer);
        }, { passive: true });

        qrWrap.addEventListener("touchend", () => {
          clearTimeout(qrTimer);
        }, { passive: true });

        qrWrap.addEventListener("touchcancel", () => {
          clearTimeout(qrTimer);
        }, { passive: true });

        qrLayer.querySelector(".qr-download-btn").addEventListener("click", (e) => {
          e.stopPropagation();
          const src = "./assets/payment-qr.jpg";
          const link = document.createElement("a");
          link.href = src;
          link.download = "payment-qr.jpg";
          link.click();
        });

        document.body.appendChild(qrLayer);
      }

      function openOrderSheet(item) {
        const t = copy[language];
        const initialColor = item.colorOptions[0]?.name || "";
        const priceForColor = (color) => {
          const option = item.colorOptions.find((entry) => entry.name === color) || item.colorOptions[0];
          return formatPrice(option.basePriceCny * rateState.rate, rateState.currency);
        };
        const layer = document.createElement("div");
        layer.className = "sheet-layer";
        layer.setAttribute("role", "dialog");
        layer.setAttribute("aria-modal", "true");
        layer.innerHTML = `
          <button class="sheet-backdrop" type="button" aria-label="Close order"></button>
          <section class="order-sheet">
            <div class="sheet-handle"></div>
            <div class="sheet-heading">
              <div>
                <p class="eyebrow">${t.selectedString}</p>
                <h2>${renderStringIdentity(item)}</h2>
              </div>
              <button class="icon-button" type="button" aria-label="Close order">×</button>
            </div>
            <form class="order-form">
              <div class="order-summary">
                <span>${displayGauge(item)}</span>
                <strong data-selected-price>${priceForColor(initialColor)}</strong>
              </div>
              <label>
                <span>${t.name}</span>
                <input name="name" placeholder="${t.namePlaceholder}" autocomplete="name" inputmode="text" />
              </label>
              <label>
                <span>${t.phone}</span>
                <input name="phone" placeholder="${t.phonePlaceholder}" type="tel" inputmode="tel" autocomplete="tel" />
              </label>
              <input type="hidden" name="color" value="${initialColor}" />
              ${
                item.serviceOnly
                  ? ""
                  : `<div class="color-field">
                      <span class="field-label">${t.stringColor}</span>
                      <div class="color-choice-grid" role="radiogroup" aria-label="${t.stringColor}">
                        ${item.colorOptions
                          .map(
                            (option) => `
                              <button class="color-choice tone-${getColorTone(option.name)} ${
                                option.name === initialColor ? "active" : ""
                              }" type="button" role="radio" aria-checked="${option.name === initialColor}" data-color="${option.name}">
                                <span>${labelForColor(option.name)}</span>
                                <strong>${formatPrice(option.basePriceCny * rateState.rate, rateState.currency)}</strong>
                              </button>`
                          )
                          .join("")}
                      </div>
                    </div>`
              }
              <label>
                <span>${t.tension}</span>
                <div class="tension-input">
                  <input name="tension" placeholder="26" inputmode="numeric" type="number" min="20" max="35" step="0.5" />
                  <span>lbs</span>
                </div>
              </label>
              <p class="form-error" hidden>${t.required}</p>
              <button class="primary-action" type="submit">${t.reviewOrder}</button>
            </form>
          </section>
        `;

        function closeSheet() {
          if (layer.classList.contains("closing")) return;
          playCloseSound();
          layer.classList.add("closing");
          window.setTimeout(() => layer.remove(), 240);
        }

        layer.querySelector(".sheet-backdrop").addEventListener("click", closeSheet);
        layer.querySelector(".icon-button").addEventListener("click", closeSheet);
        layer.querySelectorAll(".color-choice").forEach((button) => {
          button.addEventListener("click", () => {
            layer.querySelectorAll(".color-choice").forEach((choice) => {
              choice.classList.remove("active");
              choice.setAttribute("aria-checked", "false");
            });
            button.classList.add("active");
            button.setAttribute("aria-checked", "true");
            layer.querySelector('input[name="color"]').value = button.dataset.color;
            layer.querySelector("[data-selected-price]").textContent = priceForColor(button.dataset.color);
          });
        });

        layer.querySelector("form").addEventListener("submit", (event) => {
          event.preventDefault();
          const form = event.currentTarget;
          const details = Object.fromEntries(new FormData(form).entries());
          const valid = details.name && details.phone && details.color && details.tension;

          if (!valid) {
            form.querySelector(".form-error").hidden = false;
            return;
          }

          layer.querySelector(".order-sheet").innerHTML = `
            <div class="sheet-handle"></div>
            <div class="confirmation">
              <p class="eyebrow">${t.orderReview}</p>
              <h3>${renderStringIdentity(item)}</h3>
              <dl>
                <div><dt>${t.price}</dt><dd>${priceForColor(details.color)}</dd></div>
                <div><dt>${t.name}</dt><dd>${details.name}</dd></div>
                <div><dt>${t.phone}</dt><dd>${details.phone}</dd></div>
                ${item.serviceOnly ? "" : `<div><dt>${t.color}</dt><dd>${labelForColor(details.color)}</dd></div>`}
                <div><dt>${t.tension}</dt><dd>${details.tension} lbs</dd></div>
              </dl>
              <button class="primary-action" type="button" data-pay>${t.pay}</button>
              <button class="secondary-action" type="button" data-close>${t.edit}</button>
            </div>
          `;
          layer.querySelector("[data-pay]").addEventListener("click", () => {
            showQrModal();
          });
          layer.querySelector("[data-close]").addEventListener("click", closeSheet);
        });

        document.body.appendChild(layer);
      }

      function updateProfileProgress() {
        const page = document.querySelector(".profile-page");
        if (!page) return;
        const rect = page.getBoundingClientRect();
        const viewport = window.innerHeight || 1;
        const progress = Math.min(1, Math.max(0, (viewport - rect.top) / (viewport + rect.height)));
        page.style.setProperty("--scroll-progress", String(progress));
      }

      window.addEventListener("scroll", updateProfileProgress, { passive: true });
      window.addEventListener("resize", updateProfileProgress);
      loadRate();
    </script>
  </body>
</html>
